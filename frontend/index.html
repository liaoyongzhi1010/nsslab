<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d13" />
    <meta name="description" content="AI 赋能密码学研究与教学实验平台" />
    <script>
      (() => {
        const saved = localStorage.getItem("cryptolab_theme");
        const theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        const savedFontSize = localStorage.getItem("cryptolab_font_size");
        const fontSize = ["compact", "standard", "large"].includes(savedFontSize) ? savedFontSize : "standard";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.fontSize = fontSize;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" />
